name: Package builds
on:
  push: {branches: ["walk-buildbarrel-release-1"]}
env:
  BUILDBARREL_REGISTRY_ORIGIN: "https://buildbarrel-staging.home.costanga.com"
  BUILDBARREL_REGISTRY_TENANT: "fd4afa94-9b5a-473c-92e9-945ba9a93425"
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.BUILDBARREL_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions: {contents: read, id-token: write}
    outputs:
      build: ${{ steps.seal.outputs.build }}
    env:
      BUILDBARREL_PACKAGE_CI_AUDIENCE: "buildbarrel:packages:ed146ad1-6a95-4e34-92af-1322547a39f4"
      BUILDBARREL_PACKAGE_CI_CONNECTION: "ed146ad1-6a95-4e34-92af-1322547a39f4"
      BUILDBARREL_PACKAGE_RUN_AUDIENCE: "buildbarrel:package-runs:ed146ad1-6a95-4e34-92af-1322547a39f4"
      BUILDBARREL_PACKAGE: "meridian-billing-reports"
    steps:
      - name: Tell the registry that this run has started
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          BUILDBARREL_RUN_PHASE: started
        run: |
          set +e
          set -uo pipefail
          set +x
          umask 077
          case "$BUILDBARREL_RUN_PHASE" in
            started) body='{"phase":"started"}' ;;
            success|failure|cancelled) body='{"phase":"finished","conclusion":"'"$BUILDBARREL_RUN_PHASE"'"}' ;;
            *) exit 0 ;;
          esac
          say() { echo "::warning::$1 The registry is not told about this step of the run."; exit 0; }
          command -v curl >/dev/null || say "curl is not on this runner."
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || say "This job has no id-token permission."
          ask="" tell=""
          trap 'rm -f -- "$ask" "$tell"' EXIT
          ask=$(mktemp "$RUNNER_TEMP/buildbarrel-run-ask.XXXXXX") && tell=$(mktemp "$RUNNER_TEMP/buildbarrel-run-tell.XXXXXX") \
            && printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$ask" \
            || say "The runner's temporary folder cannot be written."
          curl --silent --show-error --fail --connect-timeout 10 --max-time 20 --config "$ask" --get --data-urlencode "audience=$BUILDBARREL_PACKAGE_RUN_AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | sed -n 's/.*"value"[[:space:]]*:[[:space:]]*"\([A-Za-z0-9._-]*\)".*/header = "Authorization: Bearer \1"/p' > "$tell"
          [[ -s "$tell" ]] || say "GitHub gave no token for the run report."
          post() {
            curl --silent --show-error --connect-timeout 10 --max-time 45 --config "$tell" --output /dev/null --write-out '%{http_code} %{time_connect}' \
              --header 'Content-Type: application/json' --data "$body" \
              "$BUILDBARREL_REGISTRY_ORIGIN/+api/v1/tenants/$BUILDBARREL_REGISTRY_TENANT/package-ci/connections/$BUILDBARREL_PACKAGE_CI_CONNECTION/runs"
          }
          # Out of reach means that no connection was made at all: the name did not resolve, the
          # connection was refused, or it timed out before it was made. A registry that was reached
          # and was slow, or answered anything, is not out of reach.
          unreached() { [[ $1 == 6 || $1 == 7 || ( $1 == 28 && "${2##* }" =~ ^0[.]0+$ ) ]]; }
          failed=0
          answer=$(post) || failed=$?
          if [[ "$BUILDBARREL_RUN_PHASE" == started ]]; then
            # A registry that is restarting is given a little time before the run is stopped.
            for pause in 3 6; do
              unreached "$failed" "$answer" || break
              sleep "$pause"
              failed=0
              answer=$(post) || failed=$?
            done
            if unreached "$failed" "$answer"; then
              echo "::error::This runner cannot reach the registry at $BUILDBARREL_REGISTRY_ORIGIN. A registry on a private address needs a runner of your own: name its label in the repository variable BUILDBARREL_CI_RUNNER, then run this again."
              exit 1
            fi
          fi
          code="${answer%% *}"
          if (( failed != 0 )); then
            echo "::warning::The registry did not answer the run report. The run continues."
          elif [[ "$code" != 2?? ]]; then
            echo "::warning::The registry answered $code to the run report. The run continues."
          fi
          exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install the CLI this registry serves
        shell: bash
        run: |
          set -euo pipefail
          index="$BUILDBARREL_REGISTRY_ORIGIN/+cli/simple/"
          export UV_TOOL_DIR="$RUNNER_TEMP/buildbarrel-cli/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/buildbarrel-cli/bin"
          uv tool install --no-config --reinstall --python 3.12 registry-cli --default-index "$index" --index "$index"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          "$UV_TOOL_BIN_DIR/registry" --version
      - name: Build distributions
        shell: bash
        run: uv build --package "$BUILDBARREL_PACKAGE"
      - name: Upload and seal verified build
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          shopt -s nullglob
          distributions=(dist/*.whl dist/*.tar.gz)
          (( ${#distributions[@]} )) || { echo "No distributions found" >&2; exit 1; }
          token_file=$(mktemp "$RUNNER_TEMP/buildbarrel-ci-token.XXXXXX")
          trap 'rm -f -- "$token_file"' EXIT
          uv run --no-config --no-project --python 3.12 python - <<'PY' > "$token_file"
          import json, os, urllib.parse, urllib.request
          audience = urllib.parse.quote(os.environ['BUILDBARREL_PACKAGE_CI_AUDIENCE'], safe='')
          request = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + audience,
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)['value'])
          PY
          registry publish --origin "$BUILDBARREL_REGISTRY_ORIGIN" --tenant "$BUILDBARREL_REGISTRY_TENANT" --ci-connection "$BUILDBARREL_PACKAGE_CI_CONNECTION" --ci-token-file "$token_file" --seal --json "${distributions[@]}" | tee "$RUNNER_TEMP/buildbarrel-build.json"
          uv run --no-config --no-project --python 3.12 python - "$RUNNER_TEMP/buildbarrel-build.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, uuid
          print('build=' + str(uuid.UUID(json.load(open(sys.argv[1], encoding='utf-8'))['build']['id'])))
          PY
      - name: Tell the registry how this job ended
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          BUILDBARREL_RUN_PHASE: ${{ job.status }}
        run: |
          set +e
          set -uo pipefail
          set +x
          umask 077
          case "$BUILDBARREL_RUN_PHASE" in
            started) body='{"phase":"started"}' ;;
            success|failure|cancelled) body='{"phase":"finished","conclusion":"'"$BUILDBARREL_RUN_PHASE"'"}' ;;
            *) exit 0 ;;
          esac
          say() { echo "::warning::$1 The registry is not told about this step of the run."; exit 0; }
          command -v curl >/dev/null || say "curl is not on this runner."
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || say "This job has no id-token permission."
          ask="" tell=""
          trap 'rm -f -- "$ask" "$tell"' EXIT
          ask=$(mktemp "$RUNNER_TEMP/buildbarrel-run-ask.XXXXXX") && tell=$(mktemp "$RUNNER_TEMP/buildbarrel-run-tell.XXXXXX") \
            && printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$ask" \
            || say "The runner's temporary folder cannot be written."
          curl --silent --show-error --fail --connect-timeout 10 --max-time 20 --config "$ask" --get --data-urlencode "audience=$BUILDBARREL_PACKAGE_RUN_AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | sed -n 's/.*"value"[[:space:]]*:[[:space:]]*"\([A-Za-z0-9._-]*\)".*/header = "Authorization: Bearer \1"/p' > "$tell"
          [[ -s "$tell" ]] || say "GitHub gave no token for the run report."
          post() {
            curl --silent --show-error --connect-timeout 10 --max-time 45 --config "$tell" --output /dev/null --write-out '%{http_code} %{time_connect}' \
              --header 'Content-Type: application/json' --data "$body" \
              "$BUILDBARREL_REGISTRY_ORIGIN/+api/v1/tenants/$BUILDBARREL_REGISTRY_TENANT/package-ci/connections/$BUILDBARREL_PACKAGE_CI_CONNECTION/runs"
          }
          # Out of reach means that no connection was made at all: the name did not resolve, the
          # connection was refused, or it timed out before it was made. A registry that was reached
          # and was slow, or answered anything, is not out of reach.
          unreached() { [[ $1 == 6 || $1 == 7 || ( $1 == 28 && "${2##* }" =~ ^0[.]0+$ ) ]]; }
          failed=0
          answer=$(post) || failed=$?
          if [[ "$BUILDBARREL_RUN_PHASE" == started ]]; then
            # A registry that is restarting is given a little time before the run is stopped.
            for pause in 3 6; do
              unreached "$failed" "$answer" || break
              sleep "$pause"
              failed=0
              answer=$(post) || failed=$?
            done
            if unreached "$failed" "$answer"; then
              echo "::error::This runner cannot reach the registry at $BUILDBARREL_REGISTRY_ORIGIN. A registry on a private address needs a runner of your own: name its label in the repository variable BUILDBARREL_CI_RUNNER, then run this again."
              exit 1
            fi
          fi
          code="${answer%% *}"
          if (( failed != 0 )); then
            echo "::warning::The registry did not answer the run report. The run continues."
          elif [[ "$code" != 2?? ]]; then
            echo "::warning::The registry answered $code to the run report. The run continues."
          fi
          exit 0
  validate:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.BUILDBARREL_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions: {}
    env:
      BUILDBARREL_VALIDATION_RUNNER: "53eafcbb-5a6c-411c-b31c-641df5a370f4"
      BUILDBARREL_BUILD: ${{ needs.publish.outputs.build }}
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install the CLI this registry serves
        shell: bash
        run: |
          set -euo pipefail
          index="$BUILDBARREL_REGISTRY_ORIGIN/+cli/simple/"
          export UV_TOOL_DIR="$RUNNER_TEMP/buildbarrel-cli/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/buildbarrel-cli/bin"
          uv tool install --no-config --reinstall --python 3.12 registry-cli --default-index "$index" --index "$index"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          "$UV_TOOL_BIN_DIR/registry" --version
      - name: Validate the build
        shell: bash
        env:
          BUILDBARREL_VALIDATION_RUNNER_TOKEN: ${{ secrets.BUILDBARREL_VALIDATION_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$BUILDBARREL_VALIDATION_RUNNER_TOKEN" ]] || { echo "The repository secret BUILDBARREL_VALIDATION_RUNNER_TOKEN is not set. Run registry ci connect again." >&2; exit 1; }
          token_file=$(mktemp "$RUNNER_TEMP/buildbarrel-runner-token.XXXXXX")
          trap 'rm -f -- "$token_file"' EXIT
          printf '%s\n' "$BUILDBARREL_VALIDATION_RUNNER_TOKEN" > "$token_file"
          registry-validator --origin "$BUILDBARREL_REGISTRY_ORIGIN" --tenant "$BUILDBARREL_REGISTRY_TENANT" --runner "$BUILDBARREL_VALIDATION_RUNNER" --token-file "$token_file" --build "$BUILDBARREL_BUILD" --pull --wait 300
