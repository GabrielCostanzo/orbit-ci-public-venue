# Generated by Orbit. Save as ".github/workflows/packages.yml" and commit it unchanged.
# The first push to "walk-ci-connect-1" completes a waiting connection: the registry reads the
# ORBIT_PACKAGE_CI_AUDIENCE line below from the committed file.
# Record each commit with `registry topology sync` before you push it to that branch.
# The job installs uv, Python and the registry's CLI itself. It needs a Linux runner that
# can reach the registry, and uses a GitHub-hosted one unless the repository variable
# ORBIT_CI_RUNNER names another.
name: Package builds
on:
  push: {branches: ["walk-ci-connect-1"]}
jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.ORBIT_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions: {contents: read, id-token: write}
    env:
      ORBIT_PACKAGE_CI_AUDIENCE: "orbit:packages:cff4dbb5-54a3-466b-85f1-e59106b71368"
      ORBIT_REGISTRY_ORIGIN: "https://orbit-staging.home.costanga.com"
      ORBIT_REGISTRY_TENANT: "2ff6f2fe-47f8-4f1a-877d-739bbbd15f0c"
      ORBIT_PACKAGE_CI_CONNECTION: "cff4dbb5-54a3-466b-85f1-e59106b71368"
      ORBIT_PACKAGE: "pcic-venue-sample"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install the CLI this registry serves
        shell: bash
        run: |
          set -euo pipefail
          index="$ORBIT_REGISTRY_ORIGIN/+cli/simple/"
          export UV_TOOL_DIR="$RUNNER_TEMP/orbit-cli/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/orbit-cli/bin"
          uv tool install --no-config --reinstall --python 3.12 registry-cli --default-index "$index" --index "$index"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          "$UV_TOOL_BIN_DIR/registry" --version
      - name: Build distributions
        shell: bash
        run: uv build --package "$ORBIT_PACKAGE"
      - name: Upload and seal verified build
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          shopt -s nullglob
          distributions=(dist/*.whl dist/*.tar.gz)
          (( ${#distributions[@]} )) || { echo "No distributions found" >&2; exit 1; }
          token_file=$(mktemp)
          trap 'rm -f -- "$token_file"' EXIT
          uv run --no-config --no-project --python 3.12 python - <<'PY' > "$token_file"
          import json, os, urllib.parse, urllib.request
          audience = urllib.parse.quote(os.environ['ORBIT_PACKAGE_CI_AUDIENCE'], safe='')
          request = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + audience,
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)['value'])
          PY
          registry publish --origin "$ORBIT_REGISTRY_ORIGIN" --tenant "$ORBIT_REGISTRY_TENANT" --ci-connection "$ORBIT_PACKAGE_CI_CONNECTION" --ci-token-file "$token_file" --seal --json "${distributions[@]}"
