# Generated by Orbit. Save as ".github/workflows/packages.yml" and commit it unchanged.
# The first push to "walk-journey-rehearsal-1" completes a waiting connection: the registry reads the
# ORBIT_PACKAGE_CI_AUDIENCE line below from the committed file.
# Record each commit with `registry topology sync` before you push it to that branch.
# The jobs install uv, Python and the registry's CLI themselves. They need a Linux runner that
# can reach the registry, and use a GitHub-hosted one unless the repository variable
# ORBIT_CI_RUNNER names another.
# The validate job runs the registry's validation of the build on that runner, with Docker.
# Its result is this repository's own report to the registry, not an independent check.
name: Package builds
on:
  push: {branches: ["walk-journey-rehearsal-1"]}
env:
  ORBIT_REGISTRY_ORIGIN: "http://localhost:18991"
  ORBIT_REGISTRY_TENANT: "dd627a91-b4e8-40c9-9837-8e9d3270798a"
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.ORBIT_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions: {contents: read, id-token: write}
    outputs:
      build: ${{ steps.seal.outputs.build }}
    env:
      ORBIT_PACKAGE_CI_AUDIENCE: "orbit:packages:a7730a9c-8037-484a-82f2-9e07a888ec48"
      ORBIT_PACKAGE_CI_CONNECTION: "a7730a9c-8037-484a-82f2-9e07a888ec48"
      ORBIT_PACKAGE: "meridian-billing-reports"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install the CLI this registry serves
        shell: bash
        run: |
          set -euo pipefail
          index="$ORBIT_REGISTRY_ORIGIN/+cli/simple/"
          export UV_TOOL_DIR="$RUNNER_TEMP/orbit-cli/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/orbit-cli/bin"
          uv tool install --no-config --reinstall --python 3.12 registry-cli --default-index "$index" --index "$index"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          "$UV_TOOL_BIN_DIR/registry" --version
      - name: Build distributions
        shell: bash
        run: uv build --package "$ORBIT_PACKAGE"
      - name: Upload and seal verified build
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          shopt -s nullglob
          distributions=(dist/*.whl dist/*.tar.gz)
          (( ${#distributions[@]} )) || { echo "No distributions found" >&2; exit 1; }
          token_file=$(mktemp "$RUNNER_TEMP/orbit-ci-token.XXXXXX")
          trap 'rm -f -- "$token_file"' EXIT
          uv run --no-config --no-project --python 3.12 python - <<'PY' > "$token_file"
          import json, os, urllib.parse, urllib.request
          audience = urllib.parse.quote(os.environ['ORBIT_PACKAGE_CI_AUDIENCE'], safe='')
          request = urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + audience,
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(json.load(response)['value'])
          PY
          registry publish --origin "$ORBIT_REGISTRY_ORIGIN" --tenant "$ORBIT_REGISTRY_TENANT" --ci-connection "$ORBIT_PACKAGE_CI_CONNECTION" --ci-token-file "$token_file" --seal --json "${distributions[@]}" | tee "$RUNNER_TEMP/orbit-build.json"
          uv run --no-config --no-project --python 3.12 python - "$RUNNER_TEMP/orbit-build.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, uuid
          print('build=' + str(uuid.UUID(json.load(open(sys.argv[1], encoding='utf-8'))['build']['id'])))
          PY
  validate:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.ORBIT_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions: {}
    env:
      ORBIT_VALIDATION_RUNNER: "12a17957-e83c-4265-85fe-2e19a5fb2475"
      ORBIT_BUILD: ${{ needs.publish.outputs.build }}
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Install the CLI this registry serves
        shell: bash
        run: |
          set -euo pipefail
          index="$ORBIT_REGISTRY_ORIGIN/+cli/simple/"
          export UV_TOOL_DIR="$RUNNER_TEMP/orbit-cli/tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/orbit-cli/bin"
          uv tool install --no-config --reinstall --python 3.12 registry-cli --default-index "$index" --index "$index"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          "$UV_TOOL_BIN_DIR/registry" --version
      - name: Validate the build
        shell: bash
        env:
          ORBIT_VALIDATION_RUNNER_TOKEN: ${{ secrets.ORBIT_VALIDATION_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$ORBIT_VALIDATION_RUNNER_TOKEN" ]] || { echo "The repository secret ORBIT_VALIDATION_RUNNER_TOKEN is not set. Run registry ci connect again." >&2; exit 1; }
          token_file=$(mktemp "$RUNNER_TEMP/orbit-runner-token.XXXXXX")
          trap 'rm -f -- "$token_file"' EXIT
          printf '%s\n' "$ORBIT_VALIDATION_RUNNER_TOKEN" > "$token_file"
          registry-validator --origin "$ORBIT_REGISTRY_ORIGIN" --tenant "$ORBIT_REGISTRY_TENANT" --runner "$ORBIT_VALIDATION_RUNNER" --token-file "$token_file" --build "$ORBIT_BUILD" --pull --wait 300
